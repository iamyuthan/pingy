<!DOCTYPE html>
<html>
<head>
  <title>Pingy</title>
  <style>
    .message-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-family: sans-serif;
    }
    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 6px 0 0;
      margin-right: 8px;
      display: flex;
      align-items: center;
    }
    .copy-btn svg {
      width: 20px;
      height: 20px;
      fill: #555;
      transition: fill 0.2s;
    }
    .copy-btn.copied svg {
      fill: #27ae60;
    }
  </style>
</head>
<body>
  <h2>Pingy</h2>
  <div>
    <label>Enter topic name: </label>
    <input id="topicInput" placeholder="e.g. mychat" />
    <button onclick="setTopic()">Go</button>
  </div>
  <h3>Topic: <span id="currentTopic"></span></h3>
  <textarea id="message" placeholder="Enter your message" rows="4" cols="50"></textarea><br>
  <button onclick="sendMessage()">Send</button>
  <h3>Messages</h3>
  <button onclick="loadMessages()">Refresh</button>
  <div id="messages"></div>

  <script>
    let topic = '';
    
    // Detect topic from hash fragment if available (after redirect)
    (function () {
      // Support /pingy/#/test1 or /pingy/#test1
      let hash = window.location.hash.replace(/^#\/?/, '');
      if (hash) {
        topic = hash;
        document.getElementById('topicInput').value = topic;
      } else {
        const urlParts = window.location.pathname.split('/').filter(Boolean);
        if (urlParts.length > 1) topic = urlParts[urlParts.length - 1];
        document.getElementById('topicInput').value = topic;
      }
    })();

    function updateUI() {
      document.getElementById('currentTopic').textContent = topic;
      loadMessages();
    }

     function setTopic() {
      const input = document.getElementById('topicInput').value.trim();
      if (input) {
        topic = input;
        updateUI();
        window.location.hash = '/' + topic;
      }
    }

    async function sendMessage() {
      const msg = document.getElementById('message').value;
      if (!msg) return;
      await fetch(`https://search.pingygit.workers.dev/send/${topic}`, {
        method: 'POST',
        body: msg,
      });
      document.getElementById('message').value = '';
      // loadMessages();
    }

    async function loadMessages() {
      const res = await fetch(`https://search.pingygit.workers.dev/get/${topic}`);
      let messages = await res.json();
      messages = messages.slice().reverse(); // Latest first

      const list = document.getElementById('messages');
      list.innerHTML = '';
      messages.forEach(m => {
        const row = document.createElement('div');
        row.className = 'message-row';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML =
          `<svg aria-hidden="true" focusable="false" class="octicon octicon-copy" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg>`;
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(m.message);
          copyBtn.classList.add('copied');
          setTimeout(() => copyBtn.classList.remove('copied'), 800);
        };

        row.appendChild(copyBtn);
        const msgText = document.createElement('span');
        msgText.textContent = m.message;
        row.appendChild(msgText);

        list.appendChild(row);
      });
    }

    // updateUI();
  </script>
</body>
</html>
